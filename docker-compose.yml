# docker compose up        -> dashboard on http://localhost:8501
# First run only:  docker compose exec ollama ollama pull llama3.2:3b
services:
  ollama:
    image: ollama/ollama:0.40.14
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  app:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: llama3.2:3b
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results

volumes:
  ollama:
